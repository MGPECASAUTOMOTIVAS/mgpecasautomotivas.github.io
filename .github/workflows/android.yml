# Gera o app Android do catálogo (Trusted Web Activity, com o Bubblewrap) a partir do twa-manifest.json da raiz
# e publica o .aab (para a Google Play) e o .apk (para instalar direto num celular de teste) como artefatos do run,
# guardados por 30 dias, e, quando for uma tag "android-v*", também como release do GitHub.
#
# Não envia nada para a Google Play: o envio é manual, pelo Play Console (ver play/GUIA_GOOGLE_PLAY.md no projeto).
#
# Segredos necessários (Settings → Secrets and variables → Actions → New repository secret):
#   KEYSTORE_B64       o keystore de upload em base64 (play/chave/mg-app-upload.keystore.b64 — nunca no repositório)
#   KEYSTORE_PASSWORD  a senha do keystore e da chave (play/chave/SENHAS.txt)
#
# Como rodar: Actions → "Android (Google Play)" → Run workflow. Para enviar uma versão nova à Play, o appVersionCode do
# twa-manifest.json tem que ser maior que o do último envio (ou informe-o na caixa "version_code" ao rodar).
#
# Build de TESTE (só na main ou no branch "lojas", em push ou Run workflow, e só quando os dois segredos acima NÃO
# existem; numa tag android-v* os segredos são sempre obrigatórios): o runner cria uma chave
# descartável, que some no fim do run, e assina com ela, para provar que o build funciona. Os arquivos saem com o nome
# "TESTE-NAO-ENVIAR-..." e NÃO servem para a Play (a Play recusa: a chave não é a de upload). Com os segredos
# configurados, o workflow usa sempre a chave de verdade, do mesmo jeito de antes.
name: Android (Google Play)

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: 'appVersionCode (número inteiro, maior que o do último envio à Play). Vazio = o do twa-manifest.json'
        required: false
        default: ''
  push:
    tags:
      - 'android-v*'
    # build quando o app Android muda na main (de teste enquanto os segredos não existem; ver o cabeçalho)
    branches:
      - main
    paths:
      - '.github/workflows/android.yml'
      - 'twa-manifest.json'

permissions:
  contents: write

concurrency:
  group: android
  cancel-in-progress: false

env:
  BUBBLEWRAP_VERSION: '1.27.0'
  BUILD_TOOLS: '36.1.0'

jobs:
  android:
    name: Gerar .aab e .apk
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Conferir os segredos
        env:
          KS: ${{ secrets.KEYSTORE_B64 }}
          PW: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          faltam=""
          [ -n "$KS" ] || faltam="$faltam KEYSTORE_B64"
          [ -n "$PW" ] || faltam="$faltam KEYSTORE_PASSWORD"
          if [ -z "$faltam" ]; then
            echo "MODO=real" >> "$GITHUB_ENV"
            echo "Segredos encontrados."
            exit 0
          fi
          # sem nenhum dos dois segredos, na main ou no branch lojas (push ou Run workflow): build de TESTE com chave descartável
          if [ -z "$KS" ] && [ -z "$PW" ] && { [ "$GITHUB_EVENT_NAME" = "push" ] || [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; } \
             && { [ "$GITHUB_REF" = "refs/heads/main" ] || [ "$GITHUB_REF" = "refs/heads/lojas" ]; }; then
            echo "MODO=teste" >> "$GITHUB_ENV"
            echo "::warning::Build de TESTE: sem os segredos KEYSTORE_B64 e KEYSTORE_PASSWORD, o app é assinado com uma chave descartável criada neste run. Os arquivos TESTE-NAO-ENVIAR-* não servem para a Play."
            exit 0
          fi
          echo "::error::Faltam os segredos:$faltam. Crie em Settings → Secrets and variables → Actions (veja play/GUIA_GOOGLE_PLAY.md) e rode o workflow de novo."
          exit 1

      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Preparar o Android SDK do runner e a configuração do Bubblewrap
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$SDK" ] || [ ! -d "$SDK" ]; then
            echo "::error::Android SDK não encontrado no runner (ANDROID_HOME vazio)."
            exit 1
          fi
          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            echo "::error::sdkmanager não encontrado em $SDKMANAGER."
            exit 1
          fi
          # licenças do SDK (sem perguntas) e os pacotes que o Bubblewrap e o Gradle usam
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install "build-tools;${BUILD_TOOLS}" "platforms;android-36" "platform-tools" > /dev/null
          test -d "$SDK/build-tools/${BUILD_TOOLS}"
          # o Bubblewrap procura o sdkmanager em <sdk>/bin ou <sdk>/tools/bin
          if [ ! -e "$SDK/bin" ]; then
            ln -s "$SDK/cmdline-tools/latest/bin" "$SDK/bin" 2> /dev/null || sudo ln -s "$SDK/cmdline-tools/latest/bin" "$SDK/bin"
          fi
          # arquivo que o Bubblewrap leria perguntando no terminal; com ele pronto, nada é perguntado
          mkdir -p "$HOME/.bubblewrap"
          printf '{"jdkPath":"%s","androidSdkPath":"%s"}\n' "$JAVA_HOME" "$SDK" > "$HOME/.bubblewrap/config.json"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "JDK: $JAVA_HOME"; echo "SDK: $SDK"

      - name: Instalar o Bubblewrap
        run: |
          npm install -g "@bubblewrap/cli@${BUBBLEWRAP_VERSION}"
          bubblewrap --version

      - name: Montar a pasta de build (twa-manifest.json + keystore)
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          VERSION_CODE: ${{ github.event.inputs.version_code }}
        run: |
          TWA="$RUNNER_TEMP/twa"
          mkdir -p "$TWA"
          cp twa-manifest.json "$TWA/twa-manifest.json"
          if [ "$MODO" = "teste" ]; then
            # chave descartável (só existe neste run), com o mesmo alias "mgapp" do twa-manifest.json, num arquivo com nome de teste
            TESTE_KS_PASS="$(openssl rand -hex 24)"
            echo "::add-mask::$TESTE_KS_PASS"
            echo "TESTE_KS_PASS=$TESTE_KS_PASS" >> "$GITHUB_ENV"
            node -e "const fs=require('fs');const p=process.argv[1];const m=JSON.parse(fs.readFileSync(p,'utf8'));m.signingKey.path='TESTE-chave-descartavel.keystore';fs.writeFileSync(p,JSON.stringify(m,null,2)+'\n');" "$TWA/twa-manifest.json"
            keytool -genkeypair -noprompt -storetype PKCS12 -keystore "$TWA/TESTE-chave-descartavel.keystore" -alias mgapp \
              -keyalg RSA -keysize 2048 -validity 30 -storepass "$TESTE_KS_PASS" -keypass "$TESTE_KS_PASS" \
              -dname "CN=TESTE - NAO ENVIAR A PLAY, O=Build de teste, C=BR" > /dev/null
            echo "KS_ARQ=$TWA/TESTE-chave-descartavel.keystore" >> "$GITHUB_ENV"
          else
            printf '%s' "$KEYSTORE_B64" | tr -d '\n\r ' | base64 -d > "$TWA/mg-app-upload.keystore"
            if [ ! -s "$TWA/mg-app-upload.keystore" ]; then
              echo "::error::O segredo KEYSTORE_B64 não é um base64 válido do keystore."
              exit 1
            fi
            echo "KS_ARQ=$TWA/mg-app-upload.keystore" >> "$GITHUB_ENV"
          fi
          if [ -n "$VERSION_CODE" ]; then
            case "$VERSION_CODE" in
              *[!0-9]*) echo "::error::version_code tem que ser um número inteiro (recebido: $VERSION_CODE)."; exit 1 ;;
            esac
            node -e "const fs=require('fs');const p=process.argv[1];const m=JSON.parse(fs.readFileSync(p,'utf8'));m.appVersionCode=Number(process.argv[2]);fs.writeFileSync(p,JSON.stringify(m,null,2)+'\n');" "$TWA/twa-manifest.json" "$VERSION_CODE"
          fi
          node -e "const m=require(process.argv[1]);console.log('appVersion', m.appVersion, '· appVersionCode', m.appVersionCode, '· packageId', m.packageId);" "$TWA/twa-manifest.json"
          echo "TWA=$TWA" >> "$GITHUB_ENV"

      - name: Conferir a senha do keystore
        env:
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ "$MODO" = "teste" ]; then KS_PASS="$TESTE_KS_PASS"; fi
          if ! keytool -list -keystore "$KS_ARQ" -storepass "$KS_PASS" -alias mgapp > /dev/null 2>&1; then
            echo "::error::A senha KEYSTORE_PASSWORD não abre o keystore, ou a chave 'mgapp' não existe nele."
            exit 1
          fi
          echo "Keystore e alias mgapp conferidos."

      - name: Gerar o projeto Android (bubblewrap update)
        working-directory: ${{ env.TWA }}
        run: bubblewrap update --skipVersionUpgrade

      - name: Compilar e assinar (bubblewrap build)
        working-directory: ${{ env.TWA }}
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ "$MODO" = "teste" ]; then
            export BUBBLEWRAP_KEYSTORE_PASSWORD="$TESTE_KS_PASS" BUBBLEWRAP_KEY_PASSWORD="$TESTE_KS_PASS"
          fi
          bubblewrap build --skipPwaValidation

      - name: Conferir a assinatura e nomear os arquivos
        working-directory: ${{ env.TWA }}
        run: |
          test -f app-release-bundle.aab
          test -f app-release-signed.apk
          echo "APK:"; "$ANDROID_HOME/build-tools/${BUILD_TOOLS}/apksigner" verify --print-certs app-release-signed.apk | grep -i 'SHA-256'
          echo "AAB:"; keytool -printcert -jarfile app-release-bundle.aab | grep -i 'SHA256:'
          echo "Pacote e versão do APK:"; "$ANDROID_HOME/build-tools/${BUILD_TOOLS}/aapt2" dump badging app-release-signed.apk | head -n 1
          V=$(node -e "const m=require('./twa-manifest.json');console.log(m.appVersion+'-c'+m.appVersionCode)")
          PREFIXO="mg-pecas"
          if [ "$MODO" = "teste" ]; then
            PREFIXO="TESTE-NAO-ENVIAR-mg-pecas"
            echo "::warning::Arquivos de TESTE (chave descartável). Não envie à Play; instalado pelo .apk, o app abre com a barra do navegador porque a chave não é a do assetlinks.json."
          fi
          mkdir -p saida
          cp app-release-bundle.aab "saida/$PREFIXO-$V.aab"
          cp app-release-signed.apk "saida/$PREFIXO-$V.apk"
          ls -la saida
          echo "SAIDA=$RUNNER_TEMP/twa/saida" >> "$GITHUB_ENV"

      - name: Guardar .aab e .apk como artefatos (30 dias; build de teste, 7 dias)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.MODO == 'teste' && 'TESTE-NAO-ENVIAR-mg-pecas-android' || 'mg-pecas-android' }}
          path: ${{ env.SAIDA }}/*
          retention-days: ${{ env.MODO == 'teste' && 7 || 30 }}
          if-no-files-found: error

      - name: Release do GitHub (só em tag android-v*)
        if: startsWith(github.ref, 'refs/tags/android-v') && env.MODO == 'real'
        uses: softprops/action-gh-release@v2
        with:
          name: App Android ${{ github.ref_name }}
          body: |
            App Android do catálogo MG (Trusted Web Activity).
            - `.aab`: arquivo para enviar à Google Play (Play Console).
            - `.apk`: para instalar direto num celular Android de teste.
          files: ${{ env.SAIDA }}/*
