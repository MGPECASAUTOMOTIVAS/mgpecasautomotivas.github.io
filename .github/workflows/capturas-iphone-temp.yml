# TEMPORÁRIO (sai do branch depois de guardar as capturas): capturas da ficha da App Store tiradas do próprio app do
# iPhone (pasta ios/, build Debug) no simulador do Xcode 26, sem retoque, nos 3 tamanhos de tela que a Apple aceita.
# As imagens saem no log em base64 (PNG) para serem baixadas por quem não alcança os artefatos.
# Telas: 01 Início (claro) · 02 Início (tema escuro escolhido: mg-tema = 'dark') · 03 ficha MG001 ·
# 04 peças do VW Gol 2010 1.6 · 05 Minha lista com 5 peças (gravada antes de a página carregar, argumento -mgLista).
name: Capturas iPhone (temporário)

on:
  push:
    branches:
      - lojas
    paths:
      - '.github/workflows/capturas-iphone-temp.yml'

permissions:
  contents: read

jobs:
  capturas:
    name: Capturas ${{ matrix.pasta }}
    runs-on: macos-26-intel
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          # 2ª rodada: só a tela 04 do 6,3" (na 1ª rodada, run 41539580548, ela saiu em branco); as outras 14 ficaram boas
          - pasta: iphone-6.3-1206x2622
            aparelhos: 'iPhone 17 Pro|iPhone 17|iPhone 16 Pro'
    env:
      BUNDLE_ID: br.com.mgpecasautomotivas.catalogo
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
    steps:
      - uses: actions/checkout@v4

      - name: Xcode 26 ou mais novo
        run: |
          atual=$(xcodebuild -version | head -n 1 | awk '{print $2}' | cut -d. -f1)
          if [ "${atual:-0}" -lt 26 ]; then
            novo=$(ls -d /Applications/Xcode_2[6-9]*.app 2> /dev/null | sort -V | tail -n 1)
            [ -n "$novo" ] || { echo "::error::Nenhum Xcode 26 ou mais novo neste runner."; exit 1; }
            sudo xcode-select -s "$novo/Contents/Developer"
          fi
          xcodebuild -version

      - name: Gerar o projeto e compilar para o simulador (Debug, sem assinatura)
        working-directory: ios
        run: |
          brew install xcodegen
          xcodegen generate --spec project.yml
          set -o pipefail
          xcodebuild -project MGPecas.xcodeproj -scheme MGPecas -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build 2>&1 | tee "$RUNNER_TEMP/build.log" | grep -E "error:|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" "$RUNNER_TEMP/build.log" || { tail -n 80 "$RUNNER_TEMP/build.log"; exit 1; }
          echo "APP=$PWD/build/Build/Products/Debug-iphonesimulator/MGPecas.app" >> "$GITHUB_ENV"

      - name: Criar o iPhone simulado (${{ matrix.aparelhos }})
        env:
          APARELHOS: ${{ matrix.aparelhos }}
        run: |
          xcrun simctl list -j > "$RUNNER_TEMP/simctl.json"
          python3 - "$RUNNER_TEMP/simctl.json" > "$RUNNER_TEMP/escolha.txt" << 'PY'
          import json, os, subprocess, sys
          d = json.load(open(sys.argv[1]))
          def versao(r):
              return tuple(int(x) for x in str(r.get('version', '0')).split('.') if x.isdigit())
          rts = sorted([r for r in d['runtimes'] if r.get('isAvailable') and 'SimRuntime.iOS' in r['identifier']],
                       key=versao, reverse=True)
          tipos = {t['name']: t['identifier'] for t in d['devicetypes']}
          for nome in os.environ['APARELHOS'].split('|'):
              tipo = tipos.get(nome)
              if not tipo:
                  continue
              for r in rts:
                  if any(s.get('identifier') == tipo for s in r.get('supportedDeviceTypes', [])):
                      udid = subprocess.check_output(['xcrun', 'simctl', 'create', 'MG ' + nome, tipo, r['identifier']]).decode().strip()
                      print(udid, nome, r['name'], sep='\t')
                      sys.exit(0)
          sys.exit('nenhum aparelho disponível: ' + os.environ['APARELHOS'])
          PY
          cat "$RUNNER_TEMP/escolha.txt"
          echo "UDID=$(cut -f1 "$RUNNER_TEMP/escolha.txt")" >> "$GITHUB_ENV"

      - name: Abrir o app e capturar as 5 telas
        run: |
          SAIDA="$RUNNER_TEMP/capturas"; mkdir -p "$SAIDA"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b > /dev/null
          xcrun simctl ui "$UDID" appearance light || true
          xcrun simctl status_bar "$UDID" override --time "9:41" --dataNetwork wifi --wifiMode active --wifiBars 3 \
            --cellularMode active --cellularBars 4 --batteryState charged --batteryLevel 100 || true
          xcrun simctl install "$UDID" "$APP"
          B="https://mgpecasautomotivas.github.io/"
          LISTA='[{"codigo":"MG001","qtd":2,"adicionadoEm":"2026-11-02T10:00:00.000Z"},{"codigo":"MG076","qtd":1,"adicionadoEm":"2026-11-02T11:00:00.000Z"},{"codigo":"MG1903","qtd":4,"adicionadoEm":"2026-11-02T12:00:00.000Z"},{"codigo":"MG325","qtd":2,"adicionadoEm":"2026-11-02T13:00:00.000Z"},{"codigo":"MG046","qtd":2,"adicionadoEm":"2026-11-02T14:00:00.000Z"}]'
          LISTA_B64=$(printf '%s' "$LISTA" | base64 | tr -d '\n')
          abrir() { espera="$1"; shift; xcrun simctl launch --terminate-running-process "$UDID" "$BUNDLE_ID" "$@" > /dev/null; sleep "$espera"; }
          foto() {
            xcrun simctl io "$UDID" screenshot --type=png --mask=ignored "$SAIDA/$1.png" > /dev/null 2>&1
            echo "$1: $(sips -g pixelWidth -g pixelHeight "$SAIDA/$1.png" | awk '/pixel/ {printf "%s ", $2}')"
          }
          # 1ª abertura: baixa o catálogo e liga o service worker (não é capturada)
          abrir 60
          # peças do VW Gol 2010 1.6: duas tentativas com mais tempo (fica a que mostrar a tela pronta)
          abrir 60 -mgEndereco "${B}#/veiculo/Volkswagen/Gol/2010?motor=1.6"; foto 04-pecas-do-veiculo
          abrir 75 -mgEndereco "${B}#/veiculo/Volkswagen/Gol/2010?motor=1.6"; foto 04b-pecas-do-veiculo
          echo "SAIDA=$SAIDA" >> "$GITHUB_ENV"

      - name: Pôr as capturas no log (PNG em base64)
        env:
          PASTA: ${{ matrix.pasta }}
        run: |
          for f in "$SAIDA"/*.png; do
            nome=$(basename "$f")
            echo "CAPTURA-INICIO $PASTA/$nome $(shasum -a 256 "$f" | cut -c1-64)"
            base64 -i "$f" | tr -d '\n' | fold -w 1000
            echo
            echo "CAPTURA-FIM $PASTA/$nome"
            sleep 3
          done
          sleep 15
          echo "FIM-DAS-CAPTURAS"
