# TEMPORÁRIO (sai do branch depois de guardar as capturas): capturas da ficha da Google Play tiradas do app no ar
# (https://mgpecasautomotivas.github.io/) com Playwright (Chromium, o mesmo motor do Chrome do Android, que roda o app
# da Play), sem retoque. Contexto do app da Play: user agent do Chrome no Android e a marca do app da loja na sessão
# (sessionStorage mg-app-loja = 'android', o que o app grava na 1ª abertura pelo app da Play). 416 x 900 com 2x = 832 x 1800,
# o mesmo tamanho das capturas anteriores da ficha; a moldura azul de 1080 x 1920 é feita depois, sem tocar na captura.
# As imagens saem no log em base64 (PNG) para serem baixadas por quem não alcança o site nem os artefatos.
name: Capturas Google Play (temporário)

on:
  push:
    branches:
      - lojas
    paths:
      - '.github/workflows/capturas-play-temp.yml'

permissions:
  contents: read

jobs:
  capturas:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Playwright e Chromium
        run: |
          mkdir -p "$RUNNER_TEMP/c" && cd "$RUNNER_TEMP/c"
          npm init -y > /dev/null
          npm install playwright@1.56.1 > /dev/null
          npx playwright install --with-deps chromium > /dev/null
      - name: Roteiro
        run: |
          cat > "$RUNNER_TEMP/c/capturas_play.js" << 'ROTEIRO'
          'use strict';
          const { chromium } = require('playwright');
          const fs = require('fs'), path = require('path');
          const SAIDA = path.resolve(process.argv[2] || 'saida');
          const BASE = 'https://mgpecasautomotivas.github.io/';
          const UA = 'Mozilla/5.0 (Linux; Android 10; K) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/141.0.0.0 Mobile Safari/537.36';
          const LISTA = [
            { codigo: 'MG001', qtd: 2 }, { codigo: 'MG076', qtd: 1 }, { codigo: 'MG1903', qtd: 4 },
            { codigo: 'MG325', qtd: 2 }, { codigo: 'MG046', qtd: 2 }
          ].map((x, i) => Object.assign({ adicionadoEm: '2026-11-02T1' + i + ':00:00.000Z' }, x));
          const TELAS = [
            { nome: '01-inicio', hash: '#/', espera: '.abas' },
            { nome: '02-inicio-escuro', hash: '#/', espera: '.abas', tema: 'dark' },
            { nome: '03-ficha-da-peca', hash: '#/peca/MG001', espera: 'h1, .peca-cod, .ficha' },
            { nome: '04-pecas-do-veiculo', hash: '#/veiculo/Volkswagen/Gol/2010?motor=1.6', espera: '.painel-res .lista .item-lista' },
            { nome: '05-minha-lista', hash: '#/lista', espera: '.abas', lista: true }
          ];
          function initApp(o) {
            try { sessionStorage.setItem('mg-app-loja', 'android'); } catch (e) {}
            try { if (o.tema) localStorage.setItem('mg-tema', o.tema); else localStorage.removeItem('mg-tema'); } catch (e) {}
            if (o.lista) { try { localStorage.setItem('mg-lista', JSON.stringify(o.lista)); } catch (e) {} }
            /* o Chrome do Android tem navigator.share (o Chromium do Linux, não) */
            try {
              if (!navigator.share) {
                Object.defineProperty(navigator, 'share', { value: function () { return Promise.resolve(); }, configurable: true, writable: true });
                Object.defineProperty(navigator, 'canShare', { value: function () { return true; }, configurable: true, writable: true });
              }
            } catch (e) {}
          }
          async function esperarImagens(page) {
            await page.waitForFunction(() => {
              const vh = innerHeight;
              return Array.from(document.images).filter(i => { const r = i.getBoundingClientRect(); return r.bottom > 0 && r.top < vh && r.width > 0; })
                .every(i => i.complete && i.naturalWidth > 0);
            }, null, { timeout: 25000 }).catch(() => console.log('  aviso: alguma imagem visível não carregou'));
            await page.evaluate(() => document.fonts && document.fonts.ready);
          }
          (async () => {
            const navegador = await chromium.launch();
            fs.mkdirSync(path.join(SAIDA, 'play'), { recursive: true });
            for (const tela of TELAS) {
              const ctx = await navegador.newContext({
                viewport: { width: 416, height: 900 }, deviceScaleFactor: 2, isMobile: true, hasTouch: true,
                userAgent: UA, locale: 'pt-BR', timezoneId: 'America/Sao_Paulo', colorScheme: 'light'
              });
              await ctx.addInitScript(initApp, { lista: tela.lista ? LISTA : null, tema: tela.tema || null });
              const page = await ctx.newPage();
              const erros = [];
              page.on('pageerror', e => erros.push(e.message));
              await page.goto(BASE + tela.hash, { waitUntil: 'load' });
              await page.waitForSelector('#conteudo .abrindo', { state: 'detached', timeout: 30000 }).catch(() => {});
              await page.waitForSelector(tela.espera, { timeout: 30000 });
              await page.waitForLoadState('networkidle').catch(() => {});
              await esperarImagens(page);
              await page.waitForTimeout(800);
              const info = await page.evaluate(() => ({ titulo: document.title,
                loja: document.documentElement.getAttribute('data-app-loja'),
                dataTheme: document.documentElement.getAttribute('data-theme'),
                instalar: Array.from(document.querySelectorAll('.instalar-cartao, #faixa-instalar, #folha-ios, .so-navegador')).some(function (e) {
                  var r = e.getBoundingClientRect(), cs = getComputedStyle(e);
                  return !e.hidden && cs.display !== 'none' && cs.visibility !== 'hidden' && r.width > 0 && r.height > 0; }),
                voz: !!document.querySelector('.btn-voz'),
                imagens: Array.from(document.images).filter(i => i.complete && i.naturalWidth > 0).length + '/' + document.images.length,
                versao: (self.MG_CONFIG && self.MG_CONFIG.versao) || '' }));
              await page.screenshot({ path: path.join(SAIDA, 'play', tela.nome + '.png'), type: 'png' });
              console.log('TELA', tela.nome, JSON.stringify(info), erros.length ? 'ERROS: ' + erros.join(' | ') : '');
              await ctx.close();
            }
            await navegador.close();
          })().catch(e => { console.error(e); process.exit(1); });
          ROTEIRO
      - name: Capturar do app no ar
        working-directory: ${{ runner.temp }}/c
        run: node capturas_play.js saida
      - name: Pôr as capturas no log (PNG em base64)
        working-directory: ${{ runner.temp }}/c/saida
        run: |
          for f in play/*.png; do
            echo "CAPTURA-INICIO $f $(sha256sum "$f" | cut -c1-64)"
            base64 -w 0 "$f" | fold -w 1000
            echo
            echo "CAPTURA-FIM $f"
          done
          echo "FIM-DAS-CAPTURAS"
