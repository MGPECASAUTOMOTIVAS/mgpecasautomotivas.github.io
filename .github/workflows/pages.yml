name: Publicar app no GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Tirar a pasta ios/ (app do iPhone) do site publicado
        run: |
          rm -rf ios
          # o site continua inteiro: app, prévias, dados e o assetlinks.json do app Android
          for f in index.html app.js app.css config.js sw.js manifest.webmanifest privacidade.html p/MG001.html dados/indice.json icones/icone-512.png .well-known/assetlinks.json; do
            test -s "$f" || { echo "::error::Falta $f no site."; exit 1; }
          done
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
