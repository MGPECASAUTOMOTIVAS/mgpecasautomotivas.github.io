name: Publicar app no GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Tirar a pasta ios/ (app do iPhone) do site publicado
        run: |
          rm -rf ios
          # o site continua inteiro: app, prévias, dados e o assetlinks.json do app Android
          for f in index.html app.js app.css config.js sw.js manifest.webmanifest privacidade.html p/MG001.html dados/indice.json icones/icone-512.png .well-known/assetlinks.json; do
            test -s "$f" || { echo "::error::Falta $f no site."; exit 1; }
          done
      - name: Esperar o deploy antigo do GitHub (pages build and deployment) terminar
        # Enquanto em Settings > Pages a origem for "Deploy from a branch", o GitHub também publica a
        # main crua (com ios/) a cada push. Este passo espera esse deploy acabar, para o deste
        # workflow (sem ios/) ser o último e ficar no ar. Com a origem "GitHub Actions" não há
        # deploy antigo e o passo segue na hora.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sleep 15
          for i in $(seq 1 60); do
            n=$(gh api "repos/${{ github.repository }}/actions/runs?head_sha=${{ github.sha }}&event=dynamic&per_page=50" \
              --jq '[.workflow_runs[] | select(.path == "dynamic/pages/pages-build-deployment" and .status != "completed")] | length') || n=0
            [ "$n" = "0" ] && { echo "Nenhum deploy antigo em andamento."; exit 0; }
            echo "Deploy antigo ainda rodando; esperando..."; sleep 10
          done
          echo "::warning::O deploy antigo não terminou em 10 minutos; publicando assim mesmo."
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
