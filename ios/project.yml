# App do iPhone do catálogo MG (casca nativa com WKWebView) · especificação do XcodeGen.
# O projeto Xcode (MGPecas.xcodeproj) e o Info.plist são GERADOS a partir deste arquivo no runner do GitHub
# (xcodegen generate, em .github/workflows/ios.yml) e não ficam no repositório. Para mudar o app, mude aqui ou nos
# arquivos de ios/MGPecas/.
name: MGPecas
options:
  bundleIdPrefix: br.com.mgpecasautomotivas
  developmentLanguage: pt-BR
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
targets:
  MGPecas:
    type: application
    platform: iOS
    sources:
      - path: MGPecas
    # esquema compartilhado "MGPecas" (o xcodebuild do workflow compila e arquiva por ele)
    scheme: {}
    info:
      path: MGPecas/Info.plist
      properties:
        CFBundleDisplayName: MG Peças
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleAllowMixedLocalizations: true
        LSRequiresIPhoneOS: true
        # só HTTPS, criptografia padrão do sistema: isenta (dispensa a pergunta de exportação a cada envio)
        ITSAppUsesNonExemptEncryption: false
        UIRequiredDeviceCapabilities: [arm64]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UIViewControllerBasedStatusBarAppearance: true
        # tela de abertura: fundo azul do app (escuro no modo escuro) com o logo num chip branco (Assets.xcassets)
        UILaunchScreen:
          UIColorName: FundoAbertura
          UIImageName: LogoAbertura
          UIImageRespectsSafeAreaInsets: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default Configuration
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).SceneDelegate
        # App-Bound Domains (no máximo 10): liberam o service worker no WKWebView (catálogo sem internet).
        # O 1º é o app; os outros são de onde a página busca fontes, fotos e a consulta de placa.
        WKAppBoundDomains:
          - mgpecasautomotivas.github.io
          - fonts.googleapis.com
          - fonts.gstatic.com
          - dcdn-us.mitiendanube.com
          - mg-placa.filipefrancasilva10.workers.dev
          - cdn.jsdelivr.net
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: br.com.mgpecasautomotivas.catalogo
        PRODUCT_NAME: MGPecas
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: MGPecas/Info.plist
        ENABLE_PREVIEWS: NO
        SWIFT_EMIT_LOC_STRINGS: NO
